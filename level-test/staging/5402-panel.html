<!-- wp:html --><!-- bai:seviye-testim --><section id="seviye-testim" class="bai-ltp" aria-label="Seviye testim" hidden></section><style id="bai-ltp-css">.bai-ltp{--gold:#B98A2E;--gold-ink:#1A1206;--panel:#1B2A4A;--ink:#E8EDF7;--muted:#9FB0CC;--line:rgba(232,237,247,.14);--ok:#3FBF7F;--warn:#E0654F;max-width:820px;margin:32px auto;padding:0 16px;color:var(--ink);font-family:inherit;scroll-margin-top:90px} .bai-ltp[hidden]{display:none} .bai-ltp *{box-sizing:border-box} .bai-ltp__card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,28px);margin-bottom:14px} .bai-ltp h2{font-size:clamp(1.25rem,3vw,1.6rem);line-height:1.25;margin:0 0 12px;color:var(--ink)} .bai-ltp h3{font-size:1.08rem;margin:0 0 10px;color:var(--ink)} .bai-ltp h4{font-size:.95rem;margin:16px 0 8px;color:var(--ink)} .bai-ltp p{line-height:1.6;color:var(--muted);margin:0 0 12px} .bai-ltp h2:focus,.bai-ltp h3:focus{outline:none} .bai-ltp__eyebrow{display:inline-block;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px} .bai-ltp__note{font-size:.84rem} .bai-ltp__head{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-bottom:12px} @media (min-width:640px){.bai-ltp__head{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:center}} .bai-ltp__badge{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:16px;border-radius:16px;border:1px solid rgba(185,138,46,.45);background:rgba(185,138,46,.12);margin-bottom:12px} .bai-ltp__head .bai-ltp__badge{margin-bottom:0} .bai-ltp__badge small{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)} .bai-ltp__badge strong{font-size:1.2rem;color:var(--gold)} .bai-ltp__badge span{font-size:.9rem;color:var(--ink)} .bai-ltp__badge em{font-style:normal;font-size:.84rem;color:var(--gold)} .bai-ltp__facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0} .bai-ltp__facts div{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center} .bai-ltp__facts dt{font-size:.72rem;color:var(--muted);margin-bottom:4px} .bai-ltp__facts dd{margin:0;font-size:1.05rem;font-weight:700;color:var(--ink)} .bai-ltp__acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px} .bai-ltp__btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:12px;border:1px solid var(--gold);background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:.95rem;text-decoration:none;cursor:pointer;font-family:inherit} .bai-ltp__btn:hover{filter:brightness(1.08);color:var(--gold-ink)} .bai-ltp__btn--ghost{background:transparent;color:var(--gold)} .bai-ltp__btn--ghost:hover{color:var(--gold)} .bai-ltp__btn:focus-visible,.bai-ltp__opt:focus-visible,.bai-ltp__rowbtn:focus-visible,.bai-ltp__tab:focus-visible,.bai-ltp__linkbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px} .bai-ltp__linkbtn{background:none;border:0;padding:0;margin:0 0 10px;color:var(--gold);text-decoration:underline;font:inherit;font-size:.9rem;cursor:pointer} .bai-ltp__prog{height:8px;border-radius:99px;background:rgba(232,237,247,.1);overflow:hidden;margin:6px 0 6px} .bai-ltp__prog i{display:block;height:100%;background:var(--gold);border-radius:99px} .bai-ltp__list{list-style:none;margin:10px 0 0;padding:0} .bai-ltp__row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)} .bai-ltp__row.is-done .bai-ltp__rowtitle strong{color:var(--muted)} .bai-ltp__chip{flex:0 0 auto;font-size:.75rem;font-weight:700;padding:4px 8px;border-radius:8px;background:rgba(185,138,46,.16);color:var(--gold)} .bai-ltp__rowtitle{flex:1 1 auto;min-width:0;display:flex;flex-direction:column} .bai-ltp__rowtitle strong{font-size:.95rem;color:var(--ink);overflow-wrap:anywhere} .bai-ltp__rowtitle small{font-size:.8rem;color:var(--muted)} .bai-ltp__rowbtn{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:rgba(232,237,247,.05);color:var(--ink);font:inherit;font-size:.86rem;cursor:pointer} .bai-ltp__row.is-done .bai-ltp__rowbtn{color:var(--ok)} .bai-ltp__later summary{cursor:pointer;font-weight:700;color:var(--ink)} .bai-ltp__later[open] summary{margin-bottom:10px} .bai-ltp__foot{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:4px 0 8px;font-size:.9rem} .bai-ltp__foot a{color:var(--gold)} .bai-ltp__foot .bai-ltp__linkbtn{margin:0} .bai-ltp__cardtitle{display:flex;align-items:center;gap:10px;margin-top:6px} .bai-ltp__cardtitle h2{margin:0} .bai-ltp__sub{margin-top:4px} .bai-ltp__mistakes ul{list-style:none;margin:0;padding:0} .bai-ltp__mistakes li{padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px} .bai-ltp__mistakes small{color:var(--muted)} .bai-ltp__qtext{color:var(--ink);line-height:1.5} .bai-ltp__q{padding:12px 0;border-top:1px solid var(--line)} .bai-ltp__q .bai-ltp__qtext{margin:0 0 8px} .bai-ltp__opts{display:flex;flex-wrap:wrap;gap:8px} .bai-ltp__opt{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:rgba(232,237,247,.05);color:var(--ink);font:inherit;cursor:pointer} .bai-ltp__opt:disabled{cursor:default;opacity:.75} .bai-ltp__opt.is-right{border-color:var(--ok);background:rgba(63,191,127,.16);opacity:1} .bai-ltp__opt.is-wrong{border-color:var(--warn);background:rgba(224,101,79,.16);opacity:1} .bai-ltp__fb{margin:8px 0 0;font-size:.9rem;min-height:0} .bai-ltp__fb.is-ok{color:var(--ok)} .bai-ltp__fb.is-no{color:#F2A493} .bai-ltp__tabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px} .bai-ltp__tab{min-height:38px;padding:0 14px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.86rem;cursor:pointer} .bai-ltp__tab[aria-pressed="true"]{background:rgba(185,138,46,.18);color:var(--gold)} .bai-ltp__expl{color:var(--ink)} .bai-ltp__pat{padding:10px 12px;border-left:3px solid var(--gold);background:rgba(185,138,46,.08);border-radius:0 10px 10px 0;color:var(--ink)} .bai-ltp__ex{margin:0;padding-left:20px;color:var(--ink)} .bai-ltp__ex li{margin-bottom:4px;line-height:1.5} .bai-ltp__result{margin-top:10px} .bai-ltp__win{color:var(--ok)} .bai-ltp__card.bai-ltp__win{border-color:rgba(63,191,127,.45)} .bai-ltp__card.bai-ltp__win p{color:var(--muted)} @media (prefers-reduced-motion:no-preference){.bai-ltp__opt,.bai-ltp__rowbtn,.bai-ltp__btn{transition:background-color .15s,border-color .15s}}</style><script id="bai-ltp-js">(function(){ "use strict"; var root = document.getElementById("seviye-testim"); if(!root) return; var DATA = {"q":[{"id":1,"level":"A1","prompt":"My sister ___ a teacher.","options":["be","are","am","is","I don't know"],"answer":3},{"id":2,"level":"A1","prompt":"We ___ breakfast at 8 o’clock every day.","options":["eats","eating","eat","ate","I don't know"],"answer":2},{"id":3,"level":"A1","prompt":"Choose the correct plural: one child, two ___.","options":["childs","childes","child","children","I don't know"],"answer":3},{"id":4,"level":"A1","prompt":"Where ___ you live?","options":["does","do","are","is","I don't know"],"answer":1},{"id":5,"level":"A1","prompt":"I’m thirsty. I’d like some ___.","options":["water","bread","rice","cheese","I don't know"],"answer":0},{"id":6,"level":"A1","prompt":"She ___ to school yesterday.","options":["go","goes","going","went","I don't know"],"answer":3},{"id":7,"level":"A1","prompt":"The keys are ___ the table.","options":["in","at","on","from","I don't know"],"answer":2},{"id":8,"level":"A2","prompt":"I have lived here ___ three years.","options":["since","during","from","for","I don't know"],"answer":3},{"id":9,"level":"A2","prompt":"This exercise is ___ than the last one.","options":["easy","easier","easiest","more easy","I don't know"],"answer":1},{"id":10,"level":"A2","prompt":"We haven’t finished the project ___.","options":["already","ever","still","yet","I don't know"],"answer":3},{"id":11,"level":"A2","prompt":"If it rains tomorrow, we ___ at home.","options":["will stay","stayed","stay yesterday","would stayed","I don't know"],"answer":0},{"id":12,"level":"A2","prompt":"How ___ people are coming to dinner?","options":["much","little","many","any","I don't know"],"answer":2},{"id":13,"level":"A2","prompt":"He is interested ___ photography.","options":["at","for","with","in","I don't know"],"answer":3},{"id":14,"level":"A2","prompt":"Could you ___ me where the station is?","options":["telling","tell","told","to tell","I don't know"],"answer":1},{"id":15,"level":"B1","prompt":"I’ve never ___ sushi before.","options":["eaten","ate","eat","eating","I don't know"],"answer":0},{"id":16,"level":"B1","prompt":"If I ___ more free time, I would learn Italian.","options":["have","will have","am having","had","I don't know"],"answer":3},{"id":17,"level":"B1","prompt":"The film was so ___ that I almost fell asleep.","options":["bored","boring","interest","excitedly","I don't know"],"answer":1},{"id":18,"level":"B1","prompt":"She told me that she ___ tired.","options":["is","has","be","was","I don't know"],"answer":3},{"id":19,"level":"B1","prompt":"We were having dinner when the phone ___.","options":["rang","ring","was ringing","has rung","I don't know"],"answer":0},{"id":20,"level":"B1","prompt":"I’m looking forward to ___ you again.","options":["see","saw","seeing","seen","I don't know"],"answer":2},{"id":21,"level":"B1","prompt":"The meeting was cancelled ___ the manager was ill.","options":["despite","because","although","however","I don't know"],"answer":1},{"id":22,"level":"B2","prompt":"If I had known about the delay, I ___ earlier.","options":["would leave","left","would have left","had left","I don't know"],"answer":2},{"id":23,"level":"B2","prompt":"The new policy will have a significant ___ on staff.","options":["effect","affect","effective","effectively","I don't know"],"answer":0},{"id":24,"level":"B2","prompt":"She asked whether I ___ the report.","options":["have seen","had seen","see","would seeing","I don't know"],"answer":1},{"id":25,"level":"B2","prompt":"Despite ___ very tired, he finished the presentation.","options":["he was","of being","be","being","I don't know"],"answer":3},{"id":26,"level":"B2","prompt":"The company plans to ___ a new service next month.","options":["launch","rise","grow up","raise itself","I don't know"],"answer":0},{"id":27,"level":"B2","prompt":"By the time we arrived, the concert ___.","options":["already starts","has already started","had already started","was already start","I don't know"],"answer":2},{"id":28,"level":"B2","prompt":"The issue is too complex to be ___ in a few minutes.","options":["deal","resolved","resolution","resolving","I don't know"],"answer":1},{"id":29,"level":"C1","prompt":"Hardly ___ the meeting when the fire alarm went off.","options":["we had started","did we start","had we started","we started","I don't know"],"answer":2},{"id":30,"level":"C1","prompt":"Her argument doesn’t stand up to close ___.","options":["scrutiny","scrutinize","scrutinizingly","scrutinized","I don't know"],"answer":0},{"id":31,"level":"C1","prompt":"The findings are broadly ___ with previous research.","options":["consistency","consistent","consist","consistently to","I don't know"],"answer":1},{"id":32,"level":"C1","prompt":"The board decided to postpone the vote, ___ further consultation.","options":["pending","pend","to pending","was pending","I don't know"],"answer":0},{"id":33,"level":"C1","prompt":"Not only ___ the deadline, but the team also exceeded the budget.","options":["the team missed","did the team miss","the team did miss","missed the team","I don't know"],"answer":1},{"id":34,"level":"C1","prompt":"The spokesperson gave a deliberately ___ answer, avoiding any firm commitment.","options":["unequivocal","transparent","ambiguous","explicit","I don't know"],"answer":2},{"id":35,"level":"C2","prompt":"The essay offers a remarkably ___ account, acknowledging several competing interpretations.","options":["reductive","nuanced","dogmatic","perfunctory","I don't know"],"answer":1},{"id":36,"level":"C2","prompt":"His objections were dismissed as ___ because they focused on minor details rather than the central issue.","options":["peripheral","cogent","decisive","seminal","I don't know"],"answer":0},{"id":37,"level":"C2","prompt":"Were the regulator ___ the proposal, the merger could proceed next month.","options":["approve","approving","to approve","approved","I don't know"],"answer":2},{"id":38,"level":"C2","prompt":"The author’s conclusion rests on a ___ assumption that is never explicitly defended.","options":["tacit","verbose","tangible","sporadic","I don't know"],"answer":0},{"id":39,"level":"C2","prompt":"No sooner ___ the announcement than the markets reacted.","options":["the company made","did the company make","had the company made","the company had made","I don't know"],"answer":2},{"id":40,"level":"C2","prompt":"The committee’s response was so ___ that both sides claimed it supported their position.","options":["unequivocal","categorical","clear-cut","equivocal","I don't know"],"answer":3}],"meta":{"A1":{"name":"Başlangıç","title":"A1 Kâşif"},"A2":{"name":"Temel","title":"A2 Kurucu"},"B1":{"name":"Orta","title":"B1 İletişimci"},"B2":{"name":"Orta Üstü","title":"B2 Bağımsız Konuşmacı"},"C1":{"name":"İleri","title":"C1 İleri Kullanıcı"},"C2":{"name":"Ustalık","title":"C2 Usta"}},"cards":[{"id":"a1-to-be","level":"A1","items":[1],"lead":"tr","t_tr":"“to be”: am / is / are","t_en":"The verb “to be”","tr":"“to be” (olmak) fiili özneye göre değişir: I → am; he, she, it ve tekil isimler → is; you, we, they ve çoğul isimler → are. “My sister” tek kişi olduğu için is alır.","en":"The verb “to be” changes with the subject: I am; he, she, it and singular nouns take is; you, we, they and plural nouns take are.","pat":"I am · he / she / it is · you / we / they are","ex":["My brother is a doctor.","We are in the classroom.","I am ready."],"check":[["Tom ___ my best friend.",["am","is","are"],1],["The children ___ in the garden.",["is","am","are"],2],["I ___ from Izmir.",["am","is","are"],0]],"prac":[["My parents ___ at work now.",["is","are","am"],1,"“My parents” çoğul: are."],["This book ___ very interesting.",["are","am","is"],2,"“This book” tekil: is."],["___ you a student?",["Is","Are","Am"],1,"“you” her zaman are ile kullanılır."],["It ___ cold today.",["is","are","am"],0,"“it” tekil: is."],["Ali and I ___ classmates.",["am","is","are"],2,"“Ali and I” = we: are."]]},{"id":"a1-present-simple","level":"A1","items":[2],"lead":"tr","t_tr":"Geniş zaman: we eat / she eats","t_en":"Present simple","tr":"Geniş zaman (present simple) alışkanlıkları ve düzenli olan şeyleri anlatır. I, you, we, they ile fiilin yalın hâli kullanılır; he, she, it ile fiile -s eklenir (she eats).","en":"The present simple describes habits and routines. Use the base verb with I, you, we, they; add -s with he, she, it (she eats).","pat":"we eat · she eats","ex":["I drink tea every morning.","They play football on Sundays.","My father works in a bank."],"check":[["They ___ to music every evening.",["listens","listen","listening"],1],["She ___ in Ankara.",["live","lives","living"],1],["We ___ English at school.",["study","studies","studying"],0]],"prac":[["My friends ___ coffee after class.",["drink","drinks","drinking"],0,"“My friends” = they: fiilin yalın hâli."],["He ___ the bus to work.",["take","takes","taking"],1,"he ile fiile -s eklenir: takes."],["I ___ up at seven o’clock.",["gets","getting","get"],2,"I ile yalın hâl: get."],["The shop ___ at nine.",["open","opens","opening"],1,"“The shop” = it: opens."],["You ___ very good English.",["speak","speaks","speaking"],0,"you ile yalın hâl: speak."]]},{"id":"a1-plurals","level":"A1","items":[3],"lead":"tr","t_tr":"Düzensiz çoğullar: child → children","t_en":"Irregular plurals","tr":"Çoğu isim -s alır (book → books). Bazı sık kullanılan isimler ise düzensizdir: child → children, man → men, woman → women, person → people, foot → feet, tooth → teeth.","en":"Most nouns add -s (book → books). Some common nouns are irregular: child → children, man → men, woman → women, person → people, foot → feet, tooth → teeth.","pat":"one child → two children","ex":["There are three women in the office.","My feet are cold.","Many people live in Istanbul."],"check":[["one man, two ___",["mans","men","mens"],1],["one tooth, two ___",["teeth","tooths","teeths"],0],["one woman, three ___",["womans","women","womens"],1]],"prac":[["My shoes are too small for my ___ .",["foots","feet","feets"],1,"foot → feet (düzensiz)."],["There are twenty ___ in my class.",["childs","children","childrens"],1,"child → children."],["How many ___ came to the party?",["people","peoplees","peopls"],0,"person → people; people zaten çoğuldur."],["I have two ___ and a daughter.",["son","sons","sones"],1,"Düzenli isim: son → sons."],["Brush your ___ before bed.",["tooths","teeth","teeths"],1,"tooth → teeth."]]},{"id":"a1-do-questions","level":"A1","items":[4],"lead":"tr","t_tr":"Geniş zamanda soru: do / does","t_en":"Present simple questions","tr":"Geniş zamanda soru sorarken I, you, we, they ile do; he, she, it ile does kullanılır. Ana fiil yalın kalır: Where does she live? (lives değil).","en":"To make present simple questions, use do with I, you, we, they and does with he, she, it. The main verb stays in the base form: Where does she live? (not lives).","pat":"Do you…? · Does she…? + yalın fiil","ex":["Do you like pizza?","Where does your brother work?","What time do they start school?"],"check":[["___ you speak French?",["Do","Does","Are"],0],["Where ___ your sister study?",["do","does","is"],1],["What ___ they want for dinner?",["does","is","do"],2]],"prac":[["___ he play the guitar?",["Do","Does","Is"],1,"he ile does."],["How ___ you go to school?",["do","does","are"],0,"you ile do."],["Does she ___ coffee?",["likes","like","liking"],1,"does sonrası fiil yalın: like."],["What ___ your parents do?",["does","do","are"],1,"“your parents” = they: do."],["___ it rain a lot in London?",["Do","Is","Does"],2,"it ile does."]]},{"id":"a1-everyday-words","level":"A1","items":[5],"lead":"tr","t_tr":"Günlük kelimeler: yiyecek ve içecek","t_en":"Everyday words: food and drink","tr":"Temel kelimeleri bağlamla öğrenmek en kalıcı yoldur. thirsty (susamış) bir içeceğe, hungry (aç) bir yiyeceğe ihtiyacı anlatır. İçecekler: water, tea, juice, milk. Yiyecekler: bread, rice, cheese, soup.","en":"Learn everyday words in context. Thirsty means you need a drink; hungry means you need food. Drinks: water, tea, juice, milk. Food: bread, rice, cheese, soup.","pat":"thirsty → a drink · hungry → food","ex":["I’m hungry. Let’s have some soup.","It’s hot. I’d like a glass of cold water.","She has milk with her breakfast."],"check":[["I’m hungry. I want a ___ .",["sandwich","water","tea"],0],["You drink ___ from a cup.",["bread","tea","rice"],1],["Cows give us ___ .",["milk","juice","tea"],0]],"prac":[["It’s very hot and I’m thirsty. Can I have some ___ ?",["lemonade","pasta","bread"],0,"thirsty = susamış; bir içecek: lemonade."],["We eat ___ with a spoon.",["soup","sandwiches","pizza"],0,"Çorba (soup) kaşıkla yenir."],["I’m hungry. What’s for ___ ?",["drink","dinner","water"],1,"hungry = aç: akşam yemeği (dinner)."],["Would you like a cup of ___ ?",["coffee","cheese","rice"],0,"a cup of + içecek: coffee."],["She puts ___ on her bread in the morning.",["juice","butter","tea"],1,"Ekmeğe sürülen: butter (tereyağı)."]]},{"id":"a1-past-simple","level":"A1","items":[6],"lead":"tr","t_tr":"Di’li geçmiş zaman: go → went","t_en":"Past simple: irregular verbs","tr":"yesterday, last week, ago gibi ifadeler geçmiş zamanı gösterir. Düzenli fiiller -ed alır (play → played); sık kullanılan bazı fiiller düzensizdir: go → went, eat → ate, see → saw, have → had, buy → bought.","en":"Words like yesterday, last week and ago signal the past simple. Regular verbs add -ed (play → played); many common verbs are irregular: go → went, eat → ate, see → saw, have → had, buy → bought.","pat":"yesterday + went / saw / ate","ex":["We went to the cinema last night.","I saw Ayşe at the market.","They bought a new car two years ago."],"check":[["Last summer we ___ to Antalya.",["go","went","goes"],1],["I ___ a great film yesterday.",["saw","see","seeing"],0],["She ___ a new phone last week.",["buys","buy","bought"],2]],"prac":[["He ___ breakfast at eight this morning.",["has","had","have"],1,"Bu sabah, yani geçmiş: have → had."],["They ___ football yesterday.",["played","play","plays"],0,"Düzenli fiil: play → played."],["I ___ my keys two days ago.",["lose","lost","loses"],1,"ago geçmişi gösterir: lose → lost."],["We ___ pizza for dinner last night.",["eat","eats","ate"],2,"eat → ate."],["She ___ home late yesterday.",["came","come","comes"],0,"come → came."]]},{"id":"a1-prepositions-place","level":"A1","items":[7],"lead":"tr","t_tr":"Yer edatları: in / on / at / under","t_en":"Prepositions of place","tr":"on bir yüzeyin üstünü (on the table), in bir şeyin içini (in the bag), under altını, next to yanını anlatır. at genellikle bir noktayı belirtir (at the door, at school).","en":"Use on for a surface (on the table), in for inside something (in the bag), under for below and next to for beside. At marks a point (at the door, at school).","pat":"on the table · in the box · under the bed","ex":["Your phone is on the sofa.","The milk is in the fridge.","The cat is under the chair."],"check":[["The picture is ___ the wall.",["in","on","under"],1],["My clothes are ___ the wardrobe.",["in","on","at"],0],["The dog is sleeping ___ the table, out of the sun.",["under","at","in"],0]],"prac":[["Put the plates ___ the table, please.",["in","on","under"],1,"Yüzeyin üstü: on."],["The keys are ___ my bag.",["on","at","in"],2,"Bir şeyin içi: in."],["Someone is ___ the door.",["at","in","under"],0,"Bir nokta: at the door."],["My shoes are ___ the bed, on the floor.",["at","under","in"],1,"Altında: under."],["There is a lamp ___ the sofa.",["next to","in","at"],0,"Yanında: next to."]]},{"id":"a2-for-since","level":"A2","items":[8],"lead":"tr","t_tr":"for / since","t_en":"for and since","tr":"Present perfect ile süre anlatırken for bir zaman dilimiyle (for three years, for a week), since bir başlangıç noktasıyla (since 2020, since Monday) kullanılır.","en":"With the present perfect, use for with a period of time (for three years) and since with a starting point (since 2020, since Monday).","pat":"for + süre · since + başlangıç","ex":["I have known her for ten years.","We have lived here since 2019.","He has worked there since January."],"check":[["She has been a teacher ___ 2015.",["for","since","during"],1],["We have waited ___ two hours.",["since","for","from"],1],["I haven’t seen him ___ last summer.",["since","for","during"],0]],"prac":[["They have been married ___ twenty years.",["since","for","from"],1,"Süre: for twenty years."],["I’ve had this phone ___ my birthday.",["for","during","since"],2,"Başlangıç noktası: since my birthday."],["He has studied English ___ six months.",["for","since","ago"],0,"Süre: for six months."],["She has lived in Bursa ___ she was a child.",["for","since","from"],1,"Başlangıç (bir olay): since she was a child."],["We haven’t eaten anything ___ this morning.",["since","for","during"],0,"Başlangıç: since this morning."]]},{"id":"a2-comparatives","level":"A2","items":[9],"lead":"tr","t_tr":"Karşılaştırma: easier / more expensive","t_en":"Comparatives","tr":"Kısa sıfatlar -er alır (cheap → cheaper); y ile bitenlerde y → i olur (easy → easier). Uzun sıfatlarda more kullanılır (more expensive). Ardından than gelir. Düzensizler: good → better, bad → worse.","en":"Short adjectives add -er (cheap → cheaper); -y becomes -ier (easy → easier). Long adjectives use more (more expensive). Follow with than. Irregular: good → better, bad → worse.","pat":"easier than · more expensive than","ex":["Today is hotter than yesterday.","This bag is more expensive than that one.","Her English is better than mine."],"check":[["A car is ___ than a bike.",["fast","faster","fastest"],1],["This question is ___ than the first one.",["difficulter","more difficult","most difficult"],1],["My new job is ___ than my old one.",["better","gooder","more good"],0]],"prac":[["Istanbul is ___ than Bolu.",["big","bigger","biggest"],1,"Kısa sıfat: big → bigger (son harf ikilenir)."],["This exam was ___ than I expected.",["easyer","easier","more easy"],1,"y → i: easier."],["Gold is ___ than silver.",["more expensive","expensiver","most expensive"],0,"Uzun sıfat: more expensive."],["The weather today is ___ than yesterday.",["badder","more bad","worse"],2,"Düzensiz: bad → worse."],["My sister is ___ than me.",["taller","more tall","tallest"],0,"Kısa sıfat: tall → taller."]]},{"id":"a2-yet-already","level":"A2","items":[10],"lead":"tr","t_tr":"Present perfect: yet / already / just","t_en":"yet, already, just","tr":"yet olumsuz ve soru cümlelerinde, genellikle sonda kullanılır (I haven’t finished yet). already “çoktan” anlamında olumlu cümlede, have ile fiil arasında gelir. just “az önce” demektir.","en":"Yet goes in negatives and questions, usually at the end (I haven’t finished yet). Already means “sooner than expected” and goes between have and the verb. Just means “a moment ago”.","pat":"haven’t … yet · have already … · have just …","ex":["Have you called your mum yet?","I’ve already done my homework.","The film has just started."],"check":[["I haven’t read the email ___ .",["already","yet","just"],1],["She has ___ left. You missed her by a minute.",["just","yet","ever"],0],["We have ___ eaten, so we aren’t hungry.",["yet","already","ever"],1]],"prac":[["The train hasn’t arrived ___ .",["yet","already","just"],0,"Olumsuz cümlenin sonunda: yet."],["You don’t need to buy milk. I’ve ___ bought some.",["yet","already","ever"],1,"“Çoktan”: already."],["Has the meeting started ___ ?",["yet","ever","ago"],0,"Soru cümlesinde: yet."],["I’ve ___ made this coffee. Look, it’s still hot.",["yet","just","ever"],1,"“Az önce”: just."],["They haven’t decided ___ .",["already","yet","just"],1,"Olumsuz: yet."]]},{"id":"a2-first-conditional","level":"A2","items":[11],"lead":"tr","t_tr":"Birinci koşul: If + geniş zaman, will","t_en":"First conditional","tr":"Gerçek ve olası gelecek durumlar için: If + geniş zaman, will + yalın fiil. If kısmında will kullanılmaz: If it rains, we will stay (If it will rain değil).","en":"For real, possible future situations: If + present simple, will + base verb. Don’t use will in the if-clause: If it rains, we will stay (not If it will rain).","pat":"If it rains, we will stay at home.","ex":["If you study, you will pass.","If she calls, I’ll tell her.","We will be late if we don’t hurry."],"check":[["If I see Mert, I ___ him the news.",["tell","will tell","told"],1],["If it ___ sunny tomorrow, we’ll go to the beach.",["is","will be","was"],0],["She will be angry if you ___ late again.",["will come","came","come"],2]],"prac":[["If you ___ now, you’ll catch the bus.",["leave","will leave","left"],0,"If kısmında geniş zaman: leave."],["If we don’t hurry, we ___ the film.",["miss","will miss","missed"],1,"Sonuç kısmı: will + yalın fiil."],["I’ll call you if I ___ any news.",["will get","get","got"],1,"If kısmında will kullanılmaz: get."],["If he ___ every day, he will improve.",["practises","will practise","practised"],0,"If + geniş zaman (he → -s): practises."],["They ___ happy if you visit them.",["are being","will be","were"],1,"Sonuç: will be."]]},{"id":"a2-much-many","level":"A2","items":[12],"lead":"tr","t_tr":"much / many","t_en":"much and many","tr":"many sayılabilen çoğul isimlerle (many people, many books), much sayılamayan isimlerle (much water, much time) kullanılır. How many / How much soruları da aynı kurala uyar. a lot of ikisiyle de olur.","en":"Use many with countable plural nouns (many people) and much with uncountable nouns (much water, much time). How many / How much follow the same rule. A lot of works with both.","pat":"How many people? · How much money?","ex":["How many brothers do you have?","We don’t have much time.","There are a lot of cars on the road."],"check":[["How ___ apples are in the bag?",["much","many","lot"],1],["I don’t drink ___ coffee.",["many","much","few"],1],["How ___ money do you need?",["much","many","lot of"],0]],"prac":[["There aren’t ___ students in the library today.",["much","many","little"],1,"students sayılabilir ve çoğul: many."],["How ___ sugar do you take?",["many","much","few"],1,"sugar sayılamaz: much."],["She hasn’t got ___ friends here yet.",["many","much","a little"],0,"friends sayılabilir: many."],["Is there ___ milk in the fridge?",["many","much","few"],1,"milk sayılamaz: much."],["How ___ languages do you speak?",["much","many","lot"],1,"languages sayılabilir: many."]]},{"id":"a2-adjective-prepositions","level":"A2","items":[13],"lead":"tr","t_tr":"Sıfat + edat: interested in, good at","t_en":"Adjective + preposition","tr":"Bazı sıfatlar belirli bir edatla kalıplaşmıştır ve birlikte öğrenilmelidir: interested in, good at, afraid of, proud of, different from, married to.","en":"Some adjectives always go with a particular preposition, so learn them together: interested in, good at, afraid of, proud of, different from, married to.","pat":"interested in · good at · afraid of","ex":["She is good at maths.","I’m afraid of spiders.","Their parents are proud of them."],"check":[["My brother is afraid ___ dogs.",["of","from","at"],0],["Are you good ___ drawing?",["in","at","on"],1],["I’m very interested ___ history.",["about","at","in"],2]],"prac":[["She is married ___ a doctor.",["with","to","for"],1,"Kalıp: married to."],["We are proud ___ our team.",["of","for","with"],0,"Kalıp: proud of."],["This city is very different ___ my hometown.",["from","of","at"],0,"Kalıp: different from."],["He isn’t very good ___ cooking.",["in","on","at"],2,"Kalıp: good at."],["Are you interested ___ learning Spanish?",["in","for","at"],0,"Kalıp: interested in."]]},{"id":"a2-modal-verbs","level":"A2","items":[14],"lead":"tr","t_tr":"Modal + yalın fiil: could you tell","t_en":"Modal + base verb","tr":"can, could, should, must, will gibi modallardan sonra fiil yalın hâlde gelir; to, -ing veya -s almaz: Could you tell me…? (to tell / telling değil).","en":"After modals such as can, could, should, must and will, use the base verb with no to, -ing or -s: Could you tell me…? (not to tell / telling).","pat":"could + tell · should + go","ex":["Can you help me?","You should see a doctor.","We must leave now."],"check":[["Could you ___ the window, please?",["open","to open","opening"],0],["You should ___ more water.",["drinking","drink","to drink"],1],["She can ___ three languages.",["speaks","speak","to speak"],1]],"prac":[["We must ___ our homework tonight.",["finish","to finish","finishing"],0,"must + yalın fiil: finish."],["Can I ___ your pen?",["borrowing","borrow","to borrow"],1,"can + yalın fiil: borrow."],["He should ___ to bed earlier.",["goes","going","go"],2,"should + yalın fiil: go (goes değil)."],["Could you ___ me the way to the museum?",["show","to show","showed"],0,"could + yalın fiil: show."],["You mustn’t ___ here.",["smoke","smoking","to smoke"],0,"mustn’t + yalın fiil: smoke."]]},{"id":"b1-present-perfect","level":"B1","items":[15],"lead":"tr","t_tr":"Present perfect: have + V3 (ever / never)","t_en":"Present perfect: experiences","tr":"Present perfect, have / has + fiilin üçüncü hâli (V3) ile kurulur ve hayat boyu deneyimleri anlatır: I’ve never eaten sushi. Düzensiz fiillerin V3 hâllerini bilmek gerekir: eat → eaten, write → written, see → seen, be → been.","en":"The present perfect is have / has + past participle and is used for life experiences: I’ve never eaten sushi. Learn irregular participles: eat → eaten, write → written, see → seen, be → been.","pat":"have never / ever + eaten / seen / been","ex":["Have you ever been to Paris?","She has never driven a car.","I’ve seen this film three times."],"check":[["Have you ever ___ a famous person?",["met","meet","meeting"],0],["I’ve never ___ a horse.",["rode","ridden","ride"],1],["She has ___ two books about Turkey.",["wrote","written","write"],1]],"prac":[["We have never ___ to Japan.",["be","was","been"],2,"be → been (V3)."],["Has he ever ___ a marathon?",["ran","run","running"],1,"run → ran → run: V3 run."],["I’ve ___ my wallet. I can’t find it anywhere.",["lost","lose","losing"],0,"lose → lost (V3)."],["They have ___ the news already.",["hear","heard","hearing"],1,"hear → heard (V3)."],["Have you ___ the new teacher yet?",["saw","seen","see"],1,"see → saw → seen: V3 seen."]]},{"id":"b1-second-conditional","level":"B1","items":[16],"lead":"tr","t_tr":"İkinci koşul: If + geçmiş zaman, would","t_en":"Second conditional","tr":"Şu an gerçek olmayan ya da hayalî durumlar için: If + geçmiş zaman, would + yalın fiil. Buradaki geçmiş zaman geçmişi değil, gerçek dışılığı gösterir: If I had more time, I would travel.","en":"For unreal or imaginary present situations: If + past simple, would + base verb. The past tense shows unreality, not past time: If I had more time, I would travel.","pat":"If I had…, I would…","ex":["If I won the lottery, I would buy a house.","If she lived closer, we would see her more.","I would help you if I knew the answer."],"check":[["If I ___ rich, I would travel the world.",["am","were","will be"],1],["If we had a car, we ___ to the village every weekend.",["will drive","would drive","drive"],1],["She would be happier if she ___ a different job.",["has","had","will have"],1]],"prac":[["If I ___ his number, I would call him.",["know","knew","will know"],1,"Gerçek dışı şimdi: if + geçmiş zaman (knew)."],["What would you do if you ___ a snake?",["saw","see","will see"],0,"if + geçmiş zaman: saw."],["If he studied more, he ___ better grades.",["will get","would get","gets"],1,"Sonuç kısmı: would + yalın fiil."],["If I ___ you, I would accept the offer.",["am","were","be"],1,"Kalıp: If I were you (öneri)."],["They ___ more if the tickets were cheaper.",["would travel","will travel","travelled"],0,"Sonuç: would travel."]]},{"id":"b1-ed-ing-adjectives","level":"B1","items":[17],"lead":"tr","t_tr":"-ed / -ing sıfatları: bored / boring","t_en":"-ed and -ing adjectives","tr":"-ing ile biten sıfat bir şeyin nasıl olduğunu, yani duyguyu yaratanı anlatır: The film was boring. -ed ile biten sıfat kişinin nasıl hissettiğini anlatır: I was bored. Aynı kural interesting / interested, tiring / tired, exciting / excited için de geçerlidir.","en":"-ing adjectives describe what causes the feeling: The film was boring. -ed adjectives describe how a person feels: I was bored. The same goes for interesting / interested, tiring / tired, exciting / excited.","pat":"a boring film · a bored student","ex":["The journey was very tiring.","I’m tired after the journey.","The news was surprising, and we were surprised."],"check":[["The lesson was so ___ that everyone was asking questions.",["interesting","interested","interest"],0],["I’m really ___ about my holiday next week.",["exciting","excited","excite"],1],["Ten hours of work is very ___ .",["tired","tiring","tire"],1]],"prac":[["She felt ___ when she saw the results.",["disappointing","disappointed","disappoint"],1,"Kişinin hissi: disappointed."],["The ending of the book was really ___ .",["surprised","surprising","surprise"],1,"Duyguyu yaratan şey: surprising."],["Are you ___ in art?",["interesting","interested","interest"],1,"Kişi + kalıp: interested in."],["That was a ___ match. Nobody scored.",["bored","boring","bore"],1,"Maçın kendisi: boring."],["The children were ___ by the loud noise.",["frightened","frightening","fright"],0,"Çocukların hissi: frightened."]]},{"id":"b1-reported-speech","level":"B1","items":[18],"lead":"tr","t_tr":"Dolaylı anlatım: is → was","t_en":"Reported speech","tr":"Birinin sözünü said / told ile aktarırken zaman genellikle bir adım geriye kayar: am / is → was, are → were, will → would, can → could. “I am tired.” → She said (that) she was tired.","en":"When reporting with said or told, tenses usually move one step back: am / is → was, are → were, will → would, can → could. “I am tired.” → She said (that) she was tired.","pat":"She told me (that) she was…","ex":["He said he was hungry.","They told us they were moving to Izmir.","She said she would call later."],"check":[["“I’m busy today,” he said last week. → He said he ___ busy that day.",["is","was","be"],1],["“We can help tomorrow,” they said last month. → They said they ___ help the next day.",["can","could","will"],1],["“I will be at the party,” she said. The party was last Saturday. → She said she ___ be at the party.",["will","would","can"],1]],"prac":[["“I’m learning Italian,” Emre said in 2020. → In 2020 Emre said he ___ learning Italian.",["is","was","were"],1,"am / is → was."],["“We are ready,” they said before the match. → Before the match they said they ___ ready.",["are","was","were"],2,"are → were."],["“I’ll send it tomorrow,” she said. → She said she ___ send it the next day.",["will","would","can"],1,"will → would."],["“I can’t swim,” he told me when he was ten. → When he was ten, he told me he ___ swim.",["can’t","couldn’t","won’t"],1,"can’t → couldn’t."],["“It is late,” Mum said last night. → Last night Mum said it ___ late.",["was","is","were"],0,"is → was."]]},{"id":"b1-past-continuous","level":"B1","items":[19],"lead":"tr","t_tr":"Past continuous ve past simple","t_en":"Past continuous and past simple","tr":"Geçmişte devam eden uzun bir eylem past continuous (was / were + -ing) ile, onu bölen kısa eylem past simple ile anlatılır: We were having dinner when the phone rang. when genellikle kısa eylemin, while uzun eylemin önüne gelir.","en":"Use the past continuous (was / were + -ing) for a longer action in progress and the past simple for the short action that interrupts it: We were having dinner when the phone rang. When often introduces the short action, while the long one.","pat":"was / were + -ing … when + past simple","ex":["I was walking home when it started to rain.","While she was cooking, the lights went out.","They were watching TV when I arrived."],"check":[["I was taking a shower when the doorbell ___ .",["rang","was ringing","rings"],0],["While we ___ in the park, it began to snow.",["walked","were walking","walk"],1],["When I called her, she ___ a book, so she didn’t hear the phone at first.",["read","was reading","reads"],1]],"prac":[["He ___ his leg while he was playing football.",["broke","was breaking","breaks"],0,"Kısa, bölen eylem: broke."],["What ___ you doing at 9 p.m. last night?",["did","were","was"],1,"Devam eden eylem: were you doing."],["At 1 p.m. yesterday we ___ lunch in the garden.",["were having","have","are having"],0,"Belirli bir anda devam eden eylem: were having."],["The phone rang while I ___ .",["slept","was sleeping","sleep"],1,"while + uzun eylem: was sleeping."],["We ___ TV when the electricity went off.",["watched","were watching","watch"],1,"Bölünen uzun eylem: were watching."]]},{"id":"b1-preposition-ing","level":"B1","items":[20],"lead":"tr","t_tr":"Edat + -ing: look forward to seeing","t_en":"Preposition + -ing","tr":"Edatlardan sonra fiil -ing alır: interested in learning, good at swimming, before leaving. Dikkat: look forward to, be used to ve object to kalıplarındaki to bir edattır; ardından -ing gelir: I’m looking forward to seeing you.","en":"After prepositions, verbs take -ing: interested in learning, good at swimming, before leaving. In look forward to, be used to and object to, “to” is a preposition, so -ing follows: I’m looking forward to seeing you.","pat":"look forward to + -ing","ex":["Thank you for helping me.","She left without saying goodbye.","I’m used to getting up early."],"check":[["We’re looking forward to ___ from you.",["hear","hearing","heard"],1],["He is good at ___ jokes.",["telling","tell","to tell"],0],["Thank you for ___ me.",["invite","to invite","inviting"],2]],"prac":[["She left without ___ goodbye.",["say","saying","to say"],1,"without (edat) + -ing."],["I’m used to ___ in a big city.",["live","living","lived"],1,"be used to + -ing."],["Are you interested in ___ our team?",["joining","join","to join"],0,"in (edat) + -ing."],["Before ___ the house, check the windows.",["leave","to leave","leaving"],2,"before (edat) + -ing."],["I look forward to ___ with you.",["work","working","worked"],1,"look forward to + -ing."]]},{"id":"b1-linking-words","level":"B1","items":[21],"lead":"tr","t_tr":"Bağlaçlar: because / although / so / however","t_en":"Linking words","tr":"because neden, so sonuç bildirir. although iki cümleyi zıtlıkla bağlar (-e rağmen). however aynı anlamı taşır ama yeni bir cümlenin başında, virgülle kullanılır.","en":"Because gives a reason and so a result. Although links two contrasting clauses. However has the same meaning but starts a new sentence and is followed by a comma.","pat":"because + neden · although + zıtlık · so + sonuç","ex":["We stayed inside because it was raining.","Although he was tired, he kept working.","It was late, so we took a taxi."],"check":[["I took an umbrella ___ it was raining.",["because","although","so"],0],["___ she studied hard, she failed the test.",["Because","Although","So"],1],["The shop was closed, ___ we went home.",["because","although","so"],2]],"prac":[["He couldn’t come ___ he was ill.",["because","although","however"],0,"Neden: because."],["___ the hotel was expensive, we enjoyed our stay.",["Because","So","Although"],2,"Zıtlık: although."],["The weather was terrible. ___, we had a good time.",["However","Because","Although"],0,"Yeni cümle + virgül: However."],["I was hungry, ___ I made a sandwich.",["because","so","although"],1,"Sonuç: so."],["She passed the exam ___ she didn’t study much.",["because","although","so"],1,"Zıtlık: although."]]},{"id":"b2-third-conditional","level":"B2","items":[22],"lead":"en","t_tr":"Üçüncü koşul: If + had + V3, would have + V3","t_en":"Third conditional","tr":"Geçmişte gerçekleşmemiş bir durumu ve onun hayalî sonucunu anlatır: If + had + V3, would have + V3. If I had known, I would have come (Bilseydim gelirdim).","en":"Talks about an unreal past situation and its imaginary result: If + had + past participle, would have + past participle. If I had known, I would have come.","pat":"If I had known, I would have come.","ex":["If we had left earlier, we wouldn’t have missed the train.","She would have passed if she had studied.","If you had told me, I would have helped."],"check":[["If I had seen you, I ___ hello.",["would say","would have said","had said"],1],["If she ___ the bus, she would have arrived on time.",["caught","had caught","would catch"],1],["We would have won if we ___ better.",["played","had played","would play"],1]],"prac":[["If you had asked me, I ___ you.",["would help","would have helped","had helped"],1,"Result clause: would have + past participle."],["If they ___ the map, they wouldn’t have got lost.",["had checked","checked","would check"],0,"If-clause: had + past participle."],["He wouldn’t have been late if he ___ his alarm.",["set","had set","would set"],1,"Unreal past: had set."],["If I’d known it was your birthday, I ___ a cake.",["would bake","would have baked","baked"],1,"Result clause: would have baked."],["She ___ the job if she had applied.",["would have got","would get","had got"],0,"Result clause: would have got."]]},{"id":"b2-confusing-words","level":"B2","items":[23],"lead":"en","t_tr":"Karıştırılan kelimeler: effect / affect","t_en":"Easily confused words: effect / affect","tr":"affect fiildir (etkilemek), effect isimdir (etki, sonuç): The rain affected the match. / The rain had an effect on the match. Benzer çiftler: advice (isim) / advise (fiil), loose (gevşek) / lose (kaybetmek).","en":"Affect is a verb (to influence); effect is a noun (a result or influence): The rain affected the match. / The rain had an effect on the match. Similar pairs: advice (noun) / advise (verb), loose (not tight) / lose (misplace).","pat":"have an effect on · affect something","ex":["Stress can affect your sleep.","The new law will have a big effect on prices.","My teacher advised me to read more."],"check":[["Lack of sleep can ___ your concentration.",["affect","effect","effective"],0],["The medicine had no ___ on him.",["affect","effect","affective"],1],["Can you give me some ___ ?",["advise","advice","advices"],1]],"prac":[["The strike will seriously ___ train services.",["effect","affect","affection"],1,"A verb is needed: affect."],["Music has a calming ___ on babies.",["affect","effect","effectively"],1,"After an adjective we need a noun: effect."],["I’d ___ you to book early.",["advice","advise","advising"],1,"A verb is needed: advise."],["Don’t ___ your ticket.",["loose","lose","loss"],1,"lose = misplace (verb)."],["The new rules will take ___ next month.",["affect","effect","effective"],1,"Fixed phrase: take effect."]]},{"id":"b2-reported-questions","level":"B2","items":[24],"lead":"en","t_tr":"Dolaylı sorular: She asked whether I had…","t_en":"Reported questions","tr":"Soruları aktarırken soru yapısı bozulur, özne fiilden önce gelir ve zamanlar geriye kayar. Evet/hayır sorularında if veya whether kullanılır: “Have you seen it?” → She asked whether I had seen it.","en":"In reported questions, use statement word order (subject before verb) and move the tense back. For yes/no questions use if or whether: “Have you seen it?” → She asked whether I had seen it.","pat":"asked if / whether + subject + verb (one tense back)","ex":["He asked where I lived.","She wanted to know if I had finished.","They asked me what time the shop opened."],"check":[["“Where do you work?” she asked me at the 2019 conference. → She asked me where I ___ .",["work","worked","did work"],1],["“Are you coming?” → He asked ___ I was coming.",["that","if","what"],1],["“Have you eaten?” → Mum asked whether I ___ .",["have eaten","had eaten","eat"],1]],"prac":[["“What time is it?” → Yesterday he asked me what time it ___ .",["is","was","were"],1,"One tense back and statement order: was."],["“Did you call him?” → She asked if I ___ him.",["had called","has called","did called"],0,"Past simple → past perfect: had called."],["“Can you drive?” → They asked ___ I could drive.",["whether","what","that"],0,"Yes/no question: whether (or if)."],["“Where are you going?” → He asked me where ___ .",["was I going","I was going","am I going"],1,"Statement word order: I was going."],["“Have you finished the report?” → My manager asked if I ___ the report.",["had finished","have finished","finish"],0,"Present perfect → past perfect."]]},{"id":"b2-despite","level":"B2","items":[25],"lead":"en","t_tr":"despite / in spite of + isim veya -ing","t_en":"despite / in spite of","tr":"despite ve in spite of ardından tam bir cümle değil, isim veya -ing gelir: Despite the rain / Despite being tired. Tam cümle kurmak istersen although veya despite the fact that kullan.","en":"Despite and in spite of are followed by a noun or an -ing form, not a full clause: Despite the rain / Despite being tired. For a full clause, use although or despite the fact that.","pat":"despite + noun / -ing","ex":["Despite the traffic, we arrived on time.","In spite of feeling ill, she went to work.","Despite the fact that it was late, they kept talking."],"check":[["___ the cold weather, they went swimming.",["Although","Despite","However"],1],["Despite ___ no experience, she got the job.",["she had","having","have"],1],["In spite ___ the noise, I slept well.",["of","to","from"],0]],"prac":[["___ it was expensive, we bought it.",["Despite","Although","In spite of"],1,"A full clause follows, so use although."],["Despite ___ hard, he didn’t pass.",["he studied","studying","study"],1,"despite + -ing."],["She smiled in spite ___ the bad news.",["of","for","about"],0,"Fixed form: in spite of."],["___ the delay, the meeting started on time.",["Although","Despite","However"],1,"A noun follows: despite."],["Despite the fact that ___ tired, he drove home.",["being","he was","to be"],1,"despite the fact that + full clause."]]},{"id":"b2-collocations","level":"B2","items":[26],"lead":"en","t_tr":"Kalıplaşmış fiil + isim: launch, raise, meet","t_en":"Verb + noun collocations","tr":"Bazı fiil-isim çiftleri kalıplaşmıştır (collocation): launch a product, raise prices / money, meet a deadline, make a decision, do research. Bunları tek tek değil, birlikte öğren.","en":"Some verb–noun pairs simply go together: launch a product, raise prices or money, meet a deadline, make a decision, do research. Learn them as chunks.","pat":"launch a service · meet a deadline · raise prices","ex":["The company will launch its new app in May.","We worked late to meet the deadline.","They had to raise prices this year."],"check":[["We need to ___ a decision by Friday.",["do","make","raise"],1],["The team worked all weekend to ___ the deadline.",["meet","do","raise"],0],["The charity is trying to ___ money for the hospital.",["rise","raise","grow"],1]],"prac":[["The company will ___ a new phone next month.",["launch","rise","open up"],0,"Collocation: launch a product."],["Scientists are ___ research into the virus.",["making","doing","raising"],1,"Collocation: do research."],["Our company has ___ a lot of progress this year.",["done","made","raised"],1,"Collocation: make progress."],["The bank decided to ___ interest rates.",["rise","raise","grow up"],1,"raise takes an object: raise rates."],["She ___ a mistake in the report.",["did","made","took"],1,"Collocation: make a mistake."]]},{"id":"b2-past-perfect","level":"B2","items":[27],"lead":"en","t_tr":"Past perfect: had + V3","t_en":"Past perfect","tr":"Geçmişteki iki olaydan önce olanı göstermek için had + V3 kullanılır: By the time we arrived, the concert had already started. by the time, before, after ve already ile sık görülür.","en":"Use had + past participle for the earlier of two past events: By the time we arrived, the concert had already started. It often appears with by the time, before, after and already.","pat":"By the time X happened, Y had already happened.","ex":["When I got to the station, the train had left.","She had never flown before her trip to Spain.","After he had finished, he went home."],"check":[["When we got home, we saw that someone ___ the window.",["breaks","had broken","has broken"],1],["By the time the police arrived, the thief ___ .",["escapes","had escaped","has escaped"],1],["I ___ him before, so I recognised him.",["meet","had met","have met"],1]],"prac":[["The film ___ by the time we found our seats.",["starts","had started","has started"],1,"The earlier past event: had started."],["She was nervous because she ___ on a plane before.",["had never been","never is","has never been"],0,"Experience before a past moment: had never been."],["When I phoned the shop, it ___ for the day.",["closes","had closed","has closed"],1,"It closed before I phoned: had closed."],["They ___ dinner when we arrived, so we ate alone.",["had already eaten","already eat","have already eaten"],0,"Finished before we arrived: had already eaten."],["By 2010 he ___ in five countries.",["lives","had lived","has lived"],1,"Up to a past point: had lived."]]},{"id":"b2-passive-infinitive","level":"B2","items":[28],"lead":"en","t_tr":"Edilgen mastar: to be + V3","t_en":"Passive infinitive: to be + past participle","tr":"Edilgen mastar to be + V3 şeklindedir: The issue is too complex to be resolved quickly. needs to be done, has to be checked, is expected to be finished gibi kalıplarda sık görülür.","en":"The passive infinitive is to be + past participle: The issue is too complex to be resolved quickly. It’s common in phrases like needs to be done, has to be checked, is expected to be finished.","pat":"to be + past participle","ex":["The room needs to be cleaned.","The results are expected to be published next week.","This form has to be signed by a parent."],"check":[["The report has to be ___ by Monday.",["finish","finished","finishing"],1],["These boxes need to be ___ upstairs.",["carried","carry","carrying"],0],["The winners are going to be ___ tomorrow.",["announce","announced","announcing"],1]],"prac":[["All phones must be ___ off during the exam.",["switched","switch","switching"],0,"Passive: be + past participle."],["The problem is too serious to be ___ .",["ignore","ignored","ignoring"],1,"to be + past participle: ignored."],["The documents need ___ by a lawyer.",["to check","to be checked","be checking"],1,"Passive infinitive: to be checked."],["He hopes ___ for the national team.",["to choose","to be chosen","choosing"],1,"He is the one chosen: to be chosen."],["The castle is believed to ___ in the 12th century.",["have built","have been built","be build"],1,"Past passive infinitive: to have been built."]]},{"id":"c1-negative-inversion","level":"C1","items":[29,33],"lead":"en","t_tr":"Olumsuz devrik yapı: Hardly… / Not only…","t_en":"Negative inversion","tr":"Hardly, Rarely, Never, Not only, Little gibi olumsuz ifadeler cümle başına gelirse soru düzeni kullanılır (yardımcı fiil + özne): Not only did the team miss the deadline… / Hardly had we started when… Resmî ve vurgulu bir anlatımdır.","en":"When a negative adverbial (Hardly, Rarely, Never, Not only, Little) starts a sentence, use question word order (auxiliary + subject): Not only did the team miss the deadline… / Hardly had we started when… It is formal and emphatic.","pat":"Not only did + subject + verb · Hardly had + subject + V3 … when","ex":["Rarely have I seen such a beautiful view.","Not only did she win, but she also broke the record.","Never had they felt so welcome."],"check":[["Rarely ___ such a talented student.",["I have met","have I met","I met"],1],["Not only ___ late, but he also forgot the tickets.",["he arrived","did he arrive","he did arrive"],1],["Hardly ___ down when the phone rang.",["had I sat","I had sat","did I sat"],0]],"prac":[["Never ___ so much rain in one day.",["I have seen","have I seen","I saw"],1,"Fronted “Never”: auxiliary before subject."],["Little ___ that the decision would change everything.",["did they know","they knew","they did know"],0,"Fronted “Little”: did they know."],["Not only ___ the prices, but they also reduced the quality.",["they raised","did they raise","raised they"],1,"Not only + did + subject + verb."],["Hardly had the match begun ___ it started to rain.",["than","when","then"],1,"Hardly … when (but No sooner … than)."],["Seldom ___ such generosity.",["one encounters","does one encounter","one does encounter"],1,"Fronted “Seldom”: does one encounter."]]},{"id":"c1-fixed-expressions","level":"C1","items":[30],"lead":"en","t_tr":"Kalıp ifadeler: stand up to scrutiny","t_en":"Fixed expressions","tr":"İleri seviyede bazı ifadeler kalıp olarak kullanılır ve kelime kelime değiştirilemez: stand up to scrutiny (dikkatli incelemeye dayanmak), draw a conclusion (sonuç çıkarmak), bear in mind (akılda tutmak), strike a balance (denge kurmak), come into force (yürürlüğe girmek).","en":"At advanced level many expressions are fixed and can’t be changed word for word: stand up to scrutiny, draw a conclusion, bear in mind, strike a balance, come into force.","pat":"stand up to scrutiny · draw a conclusion · bear in mind","ex":["The minister came under fire for the decision.","It’s too early to draw any conclusions.","Bear in mind that the office closes at five."],"check":[["It’s too early to ___ any conclusions.",["draw","pull","get up"],0],["Please ___ in mind that prices may change.",["bear","put","hold"],0],["The company came under ___ for its poor service.",["fire","flame","heat"],0]],"prac":[["The campaign aims to ___ awareness of climate change.",["rise","raise","lift"],1,"Collocation: raise awareness."],["His theory does not stand up to close ___ .",["scrutiny","scrutinise","scrutinising"],0,"Fixed: stand up to (close) scrutiny."],["We need to ___ a balance between cost and quality.",["strike","hit","beat"],0,"Fixed: strike a balance."],["The new rules will come into ___ in January.",["force","strength","might"],0,"Fixed: come into force."],["She took the criticism in her ___ and carried on.",["stride","step","walk"],0,"Fixed: take something in your stride."]]},{"id":"c1-word-formation","level":"C1","items":[31],"lead":"en","t_tr":"Kelime türetme: consistent / consistency","t_en":"Word formation","tr":"İleri seviyede doğru kelime türünü seçmek önemlidir. Boşluğun cümledeki görevine bak: be fiilinden sonra genellikle sıfat (consistent), a / the sonrası isim (consistency), fiili niteleyen yerde zarf (consistently) gelir.","en":"Choose the right word class from the gap’s job in the sentence: after be you usually need an adjective (consistent), after a / the a noun (consistency), and to modify a verb an adverb (consistently).","pat":"is consistent · the consistency · consistently high","ex":["The results are consistent with earlier studies.","Consistency is key when learning a language.","She has performed consistently well."],"check":[["The two reports are not ___ with each other.",["consistency","consistent","consistently"],1],["The ___ of the data surprised the researchers.",["reliable","reliability","reliably"],1],["Prices have risen ___ over the past year.",["steady","steadiness","steadily"],2]],"prac":[["Her explanation was clear and ___ .",["persuasion","persuasive","persuasively"],1,"After “was clear and”: an adjective."],["There is growing ___ to the plan.",["oppose","opposition","opposed"],1,"A noun is needed after “growing”: opposition."],["The team worked ___ to finish on time.",["efficient","efficiency","efficiently"],2,"It modifies the verb “worked”: an adverb."],["The ___ of the new policy is still unclear.",["effective","effectiveness","effectively"],1,"After “the”: a noun."],["These findings are highly ___ to our research.",["relevance","relevant","relevantly"],1,"After “are highly”: an adjective."]]},{"id":"c1-formal-prepositions","level":"C1","items":[32],"lead":"en","t_tr":"Resmî edatlar: pending, regarding, notwithstanding","t_en":"Formal prepositions","tr":"Resmî yazılarda bazı kelimeler edat gibi kullanılır: pending (… sonuçlanana kadar, … beklenirken), regarding / concerning (… ile ilgili), notwithstanding (…-e rağmen), in light of (… ışığında).","en":"Formal writing uses some words as prepositions: pending (until / while waiting for), regarding / concerning (about), notwithstanding (despite), in light of (considering).","pat":"pending further review · regarding your request","ex":["The decision was postponed pending further review.","I’m writing regarding your recent order.","In light of the new evidence, the case was reopened."],"check":[["The project is on hold ___ approval from the board.",["pending","regarding","despite of"],0],["I’m contacting you ___ the invoice you sent.",["regarding","pending","notwithstanding"],0],["___ the new data, we revised our forecast.",["In light of","Pending","On spite of"],0]],"prac":[["He was suspended ___ an investigation.",["pending","notwithstanding","besides"],0,"pending = until the investigation is complete."],["Please send any questions ___ the course to our office.",["concerning","pending","notwithstanding"],0,"concerning = about."],["___ the difficulties, the project was a success.",["Notwithstanding","Pending","Regarding"],0,"notwithstanding = despite."],["___ the storm warning, the flight was cancelled.",["In light of","Pending","Regarding of"],0,"in light of = considering."],["No action will be taken ___ the results of the review.",["pending","besides","notwithstanding"],0,"pending = while waiting for."]]},{"id":"c1-precise-adjectives","level":"C1","items":[34],"lead":"en","t_tr":"Anlamı yakın sıfatlar: ambiguous / explicit / vague","t_en":"Precise adjectives","tr":"İleri seviyede yakın veya zıt anlamlı sıfatları ayırt etmek gerekir: ambiguous (birden fazla anlama gelebilen), explicit / unequivocal (açık ve net), transparent (şeffaf), vague (belirsiz, ayrıntısız).","en":"Advanced learners need to separate close or opposite adjectives: ambiguous (open to more than one meaning), explicit / unequivocal (completely clear), transparent (open, nothing hidden), vague (unclear, lacking detail).","pat":"an ambiguous answer ≠ an explicit answer","ex":["The instructions were vague, so nobody knew what to do.","The contract makes it explicit that payment is due in 30 days.","The company promised to be transparent about its costs."],"check":[["The sentence is ___: it can be read in two ways.",["ambiguous","explicit","transparent"],0],["She gave ___ instructions, so there was no confusion.",["vague","explicit","ambiguous"],1],["His description was so ___ that we couldn’t find the place.",["vague","precise","explicit"],0]],"prac":[["The government promised a more ___ process, open to public scrutiny.",["transparent","ambiguous","vague"],0,"transparent = open, nothing hidden."],["The rule is ___: no phones in the exam room.",["explicit","ambiguous","vague"],0,"explicit = clearly stated."],["The wording of the contract is ___, so the lawyers disagree on what it means.",["ambiguous","explicit","unequivocal"],0,"ambiguous = open to more than one reading."],["He gave an ___ “no”. There was no doubt about his answer.",["unequivocal","ambiguous","vague"],0,"unequivocal = completely clear."],["The report is rather ___ on details, so we need more information.",["vague","explicit","transparent"],0,"vague = lacking detail."]]},{"id":"c2-formal-inversion","level":"C2","items":[37,39],"lead":"en","t_tr":"Resmî devrik yapı: Were… to / No sooner had…","t_en":"Formal inversion in conditionals","tr":"C2 düzeyinde koşul cümleleri if olmadan, devrik yapıyla kurulabilir: Were the regulator to approve… (= If the regulator approved…), Had I known… (= If I had known…), Should you need… (= If you need…). No sooner had … than kalıbı “…ır …maz” anlamı verir.","en":"At C2, conditionals can drop if and invert: Were the regulator to approve… (= If the regulator approved…), Had I known… (= If I had known…), Should you need… (= If you need…). No sooner had … than means “immediately after”.","pat":"Were + subject + to + verb · Had + subject + V3 · No sooner had … than","ex":["Should you have any questions, please contact us.","Had we left earlier, we would have caught the train.","No sooner had she arrived than the meeting began."],"check":[["___ you need further help, do not hesitate to call.",["Should","Would","Were"],0],["___ I known, I would have acted differently.",["Had","Have","Should"],0],["No sooner had we sat down ___ the lights went out.",["when","than","then"],1]],"prac":[["Were the company ___ its prices, it would lose customers.",["to raise","raising","raise"],0,"Were + subject + to + verb."],["___ the weather improve, the race will go ahead.",["Should","Had","Were"],0,"Should + subject + base verb = if."],["Had they ___ the warning, the accident would not have happened.",["heeded","heed","to heed"],0,"Had + subject + past participle."],["No sooner ___ the speech than the protests began.",["had he finished","he had finished","did he finished"],0,"No sooner had + subject + past participle."],["Were it not ___ your support, the project would collapse.",["for","to","of"],0,"Fixed form: Were it not for…"]]},{"id":"c2-evaluative-vocabulary","level":"C2","items":[35,36,38,40],"lead":"en","t_tr":"Değerlendirme sıfatları: nuanced, tacit, peripheral, equivocal","t_en":"Evaluative academic vocabulary","tr":"C2 düzeyinde metin ve argümanları değerlendirirken kullanılan ince anlamlı sıfatlar: nuanced (ince ayrımları gören), reductive (fazla basitleştiren), tacit (açıkça söylenmeyen, örtük), peripheral (ikincil), equivocal (iki anlama çekilebilen), cogent (ikna edici, sağlam), seminal (çığır açan), perfunctory (özensiz, baştan savma).","en":"Subtle evaluative adjectives for discussing texts and arguments at
